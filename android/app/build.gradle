plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personalworkbench'
    compileSdk 34

    defaultConfig {
        applicationId "com.personalworkbench"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 无需任何第三方依赖，纯 WebView 加载本地网页
}
